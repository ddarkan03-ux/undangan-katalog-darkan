<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Katalog Pilihan Desain Undangan</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,sans-serif;background:#F6F3EE;color:#4A3F38;padding:24px}
.top{max-width:1040px;margin:0 auto 18px}
h1{font-size:1.5rem;margin:0 0 4px}.top p{margin:0;opacity:.8}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;max-width:1040px;margin:0 auto}
.c{background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 18px rgba(74,63,56,.1)}
.pv{position:relative;width:100%;aspect-ratio:390/560;overflow:hidden;border-radius:12px;background:#ddd}
.pv iframe,.pv img.cv{position:absolute;left:0;top:0;border:0;pointer-events:none;transform-origin:0 0}
.pv img.cv{width:100%;height:100%;object-fit:cover}
.pv iframe{width:390px;height:560px}
.pv a.ov{position:absolute;inset:0;z-index:2}
.c b{display:block;margin-top:10px}.c small{display:block;opacity:.75;margin:2px 0 10px;min-height:2.9em}
.b{display:inline-block;padding:8px 16px;border:0;border-radius:999px;background:#8B6B58;color:#fff;font:600 .85rem system-ui,sans-serif;text-decoration:none;cursor:pointer}
.b.o{background:transparent;color:#8B6B58;border:1px solid #8B6B58}
.kosong{max-width:1040px;margin:30px auto;text-align:center}
</style></head><body>
<div class="top"><h1>Katalog Pilihan Desain Undangan</h1>
<p>Cover di bawah adalah tampilan asli tiap model. Klik untuk membuka undangan lengkap. Gunakan HP untuk tampilan terbaik.</p></div>
<div class="g" id="g"></div>
<p class="kosong" id="kosong" hidden>Belum ada model. Tambahkan di assets/js/katalog-data.js</p>
<script src="assets/js/katalog-data.js"></script>
<script>
(function () {
  var K = window.KATALOG || [], g = document.getElementById('g');
  if (!K.length) document.getElementById('kosong').hidden = false;
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x) n.textContent = x; return n; }
  K.forEach(function (k) {
    var card = el('div', 'c'), pv = el('div', 'pv'); pv.style.background = k.warna || '#ddd';
    if (k.cover) { var im = el('img', 'cv'); im.src = k.cover; im.alt = k.nama; im.loading = 'lazy'; pv.appendChild(im); }
    else { var f = el('iframe'); f.src = k.file; f.loading = 'lazy'; f.tabIndex = -1; f.title = 'Cover ' + k.nama; pv.appendChild(f); }
    var ov = el('a', 'ov'); ov.href = k.file; ov.setAttribute('aria-label', 'Buka ' + k.nama); pv.appendChild(ov);
    card.appendChild(pv); card.appendChild(el('b', '', k.nama)); card.appendChild(el('small', '', k.deskripsi || ''));
    var a = el('a', 'b', 'Buka'); a.href = k.file; card.appendChild(a); card.appendChild(document.createTextNode(' '));
    var s = el('button', 'b o', 'Salin tautan'); s.type = 'button';
    s.onclick = function () {
      var u = new URL(k.file === 'index.html' ? './' : k.file, location.href).href;
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { s.textContent = 'Tersalin'; setTimeout(function () { s.textContent = 'Salin tautan'; }, 1500); }, function () { prompt('Salin tautan:', u); });
    };
    card.appendChild(s); g.appendChild(card);
  });
  function skala() {
    [].forEach.call(document.querySelectorAll('.pv iframe'), function (f) {
      var w = f.parentNode.clientWidth; f.style.transform = 'scale(' + (w / 390) + ')';
    });
  }
  window.addEventListener('resize', skala); skala(); setTimeout(skala, 300);
})();
</script></body></html>
